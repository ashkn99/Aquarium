[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqua-assistant"
version = "0.1.0"
description = "Adaptive aquarium health troubleshooting assistant (Bayesian inference engine)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
