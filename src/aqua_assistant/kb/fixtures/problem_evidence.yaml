# The core likelihood table: P(evidence_state | problem present) vs
# P(evidence_state | problem absent), for every (problem, evidence, state)
# combination worth encoding. Negative evidence ("confirmed safe ammonia
# reduces ammonia_toxicity") is just another explicit row for that state --
# no special-casing needed in the engine.
#
# Values are deliberately approximate, expert-reviewable estimates, not
# measured statistics -- provenance/rationale is inline per row so a
# domain expert can challenge specific numbers in a PR review.

