# Numeric-reading bucketing. min/max are inclusive/exclusive per the flags
# below; a null bound means unbounded in that direction. These are the
# single source of truth for "what counts as high ammonia" etc. -- likelihood
# rows in problem_evidence.yaml reference range_key, never raw thresholds.

# ammonia_ppm
- id: ammonia_safe
  evidence_id: ammonia_ppm
  range_key: safe
  max_value: 0.25
  max_inclusive: false
  label: "< 0.25 ppm (safe)"
  order: 0
- id: ammonia_elevated
  evidence_id: ammonia_ppm
  range_key: elevated
  min_value: 0.25
  max_value: 1.0
  min_inclusive: true
  max_inclusive: false
  label: "0.25 - 1.0 ppm (elevated)"
  order: 1
- id: ammonia_high
  evidence_id: ammonia_ppm
  range_key: high
  min_value: 1.0
  max_value: 2.0
  min_inclusive: true
  max_inclusive: false
  label: "1.0 - 2.0 ppm (high)"
  order: 2
- id: ammonia_critical
  evidence_id: ammonia_ppm
  range_key: critical
  min_value: 2.0
  min_inclusive: true
  label: ">= 2.0 ppm (critical)"
  order: 3

