# Predefined answer options for boolean/categorical questions. Numeric
# questions don't need entries here -- a raw reading is bucketed via
# evidence_ranges.yaml instead. default_confidence implements the
# per-observation confidence value; it's overridable by an actual
# user-supplied confidence at answer time.

