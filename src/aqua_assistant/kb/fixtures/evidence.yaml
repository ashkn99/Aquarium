# Observable symptoms, parameters, and context. `data_type` determines how
# a value is captured: boolean (yes/no), categorical (one of a fixed set
# of states), or numeric (a raw reading, bucketed via evidence_ranges.yaml
# into the states problem_evidence.yaml actually reasons about).

# --- respiratory_distress group ---
- id: gasping
  name: Gasping at the surface
  data_type: boolean
  evidence_group_id: respiratory_distress
  rationale: Classic acute-distress sign, shared by several water-quality/oxygen problems.

- id: rapid_breathing
  name: Rapid gill movement
  data_type: boolean
  evidence_group_id: respiratory_distress
  rationale: Same underlying oxygen-exchange stress as gasping, observed differently.

- id: surface_breathing
  name: Spending unusual time at the surface
  data_type: boolean
  evidence_group_id: respiratory_distress
  rationale: A milder/earlier form of the same respiratory-distress signal.

# --- lethargy_cluster group ---
- id: lethargy
  name: Reduced activity
  data_type: boolean
  evidence_group_id: lethargy_cluster

- id: appetite_loss
  name: Loss of appetite
  data_type: boolean
  evidence_group_id: lethargy_cluster

- id: hiding
  name: Hiding more than usual
  data_type: boolean
  evidence_group_id: lethargy_cluster

# --- ungrouped, highly specific symptom ---
- id: white_spots
  name: Small white, salt-grain-like spots
  data_type: boolean
  rationale: Pathognomonic for Ich -- not correlated with other symptom groups, kept standalone.

# --- fin_damage group ---
- id: frayed_fins
  name: Frayed or eroding fins
  data_type: boolean
  evidence_group_id: fin_damage

- id: clamped_fins
  name: Fins held clamped to the body
  data_type: boolean
  evidence_group_id: fin_damage

# --- external_irritation group ---
- id: red_streaks_or_gills
  name: Red streaks or inflamed gills
  data_type: boolean
  evidence_group_id: external_irritation

- id: excess_mucus
  name: Excessive slime/mucus coating
  data_type: boolean
  evidence_group_id: external_irritation

- id: flashing_scratching
  name: Darting/scratching against decor or substrate
  data_type: boolean
  evidence_group_id: external_irritation

# --- progression / scope (categorical, ungrouped -- these describe the
# case as a whole rather than a single correlated symptom) ---
- id: num_fish_affected
  name: Number of fish showing symptoms
  data_type: categorical

- id: onset_timing
  name: How quickly symptoms started
  data_type: categorical

# --- water parameters (numeric, bucketed via evidence_ranges.yaml) ---
- id: ammonia_ppm
  name: Ammonia
  data_type: numeric
  unit: ppm

- id: nitrite_ppm
  name: Nitrite
  data_type: numeric
  unit: ppm

- id: nitrate_ppm
  name: Nitrate
  data_type: numeric
  unit: ppm

- id: ph_level
  name: pH
  data_type: numeric
  unit: pH

- id: temperature_f
  name: Water temperature
  data_type: numeric
  unit: "°F"

- id: dissolved_oxygen_ppm
  name: Dissolved oxygen
  data_type: numeric
  unit: ppm

- id: tank_age_days
  name: Tank age
  data_type: numeric
  unit: days

# --- setup / recent-change context (ungrouped booleans) ---
- id: recent_fish_added
  name: New fish added in the last 2 weeks
  data_type: boolean

- id: recent_water_change_large
  name: Large (>30%) water change in the last 2 days
  data_type: boolean

- id: filter_disrupted
  name: Filter cleaned, replaced, or turned off recently
  data_type: boolean

- id: ph_swings_reported
  name: pH fluctuates noticeably between tests
  data_type: boolean

# --- water quality (batch 1) ---
- id: used_untreated_tap_water
  name: Used tap water without a dechlorinator
  data_type: boolean
  rationale: Direct causal-history question -- the single most diagnostic fact for chlorine/chloramine poisoning.

- id: water_change_frequency
  name: How often water changes are performed
  data_type: categorical

- id: copper_source_exposure
  name: Recent copper-based medication, old copper plumbing, or copper-alloy decor/fixtures
  data_type: boolean

# --- environmental/system (batch 2) ---
- id: overstocking_reported
  name: Tank feels overstocked (more fish than filter/tank size comfortably supports)
  data_type: boolean
  rationale: A subjective but genuinely useful self-assessment question -- exact "safe" stocking varies by species and setup, so a direct history question is more practical than deriving it from other evidence.

- id: planted_tank_with_co2_injection
  name: Planted tank running injected CO2
  data_type: boolean
  rationale: Essentially a precondition for co2_injection_excess -- highly discriminating on its own.

- id: visible_debris_or_detritus_buildup
  name: Visible debris/detritus buildup in a specific area of the tank
  data_type: boolean

# --- infectious/parasitic disease (batch 3) ---
- id: cottony_fuzzy_growth
  name: Cottony/fuzzy grey-white growth on the body or fins
  data_type: boolean
  rationale: Pathognomonic-ish for Saprolegnia fungal infection; kept ungrouped like white_spots since it's a standalone defining sign.

- id: gold_rust_dust_coating
  name: Fine gold or rust-colored dusty coating on the skin
  data_type: boolean
  rationale: Pathognomonic-ish for velvet disease (Oodinium); kept ungrouped as a standalone defining sign.

- id: white_fuzzy_patches_around_mouth
  name: White/grey fuzzy patches specifically around the mouth
  data_type: boolean
  rationale: Pathognomonic-ish for columnaris ("cotton mouth"); location (mouth) distinguishes it from Saprolegnia's body-wide growth.

- id: abnormal_buoyancy_or_swimming
  name: Abnormal buoyancy or swimming (floating, sinking, swimming sideways/upside-down)
  data_type: boolean
  rationale: The defining symptom of swim bladder disorder.

- id: pinecone_scales
  name: Scales standing out from the body like a pinecone
  data_type: boolean
  evidence_group_id: dropsy_signs
  rationale: Pathognomonic sign for dropsy, though it appears later than general bloating.

- id: bloated_body
  name: Noticeably bloated/swollen body
  data_type: boolean
  evidence_group_id: dropsy_signs

# --- husbandry/behavior (batch 4) ---
- id: torn_or_missing_fins_from_biting
  name: Torn or missing chunks of fin, consistent with biting (not frayed edges)
  data_type: boolean
  evidence_group_id: aggression_signs
  rationale: Distinguished from frayed_fins (disease/water-quality erosion pattern) by the bitten/torn appearance.

- id: chasing_or_nipping_observed
  name: Observed another fish chasing or nipping this one
  data_type: boolean
  evidence_group_id: aggression_signs
  rationale: Direct behavioral observation, the most diagnostic single fact for aggression.

- id: overfeeding_reported
  name: Feeding more than fish finish within a couple of minutes
  data_type: boolean
  evidence_group_id: overfeeding_signs

- id: uneaten_food_accumulating
  name: Uneaten food visibly accumulating in the tank
  data_type: boolean
  evidence_group_id: overfeeding_signs

- id: improper_acclimation_reported
  name: New fish added without a slow drip/float acclimation process
  data_type: boolean

- id: insufficient_hiding_places
  name: Tank has little to no cover, decor, or hiding places
  data_type: boolean

- id: color_fading_or_pale
  name: Noticeable fading or paling of normal coloration
  data_type: boolean
  rationale: A classic sign of chronic, low-grade stress rather than acute illness.

- id: sudden_multiple_fish_death
  name: Multiple fish have died suddenly, close together in time
  data_type: boolean
  rationale: >
    Primarily a safety-relevant meta-signal (drives the mass_mortality_event
    rule), but it does carry genuine, if coarse, diagnostic content: mass
    mortality is far more consistent with fast-acting acute crises than
    with slow chronic conditions. It's given a representative (not
    exhaustive) set of problem_evidence rows against a few of each kind,
    rather than every problem in the KB, to keep it a light, secondary
    signal rather than the main driver of any diagnosis.
