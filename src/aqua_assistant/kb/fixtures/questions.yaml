# One question per evidence item. priority_weight = expert-assigned
# clinical importance; effort_cost = how much work/equipment answering
# takes (covers "user effort" and "answerability" as one dimension for
# MVP simplicity); reliability = how much to trust a typical user's answer.

- id: ask_gasping
  text: Is the fish gasping at the surface?
  evidence_id: gasping
  priority_weight: 1.2
  effort_cost: 1.0
  reliability: 0.85
- id: ask_rapid_breathing
  text: Are the gills moving noticeably faster than normal?
  evidence_id: rapid_breathing
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.75
  rationale: Harder for a non-expert to judge "normal" gill rate accurately.
- id: ask_surface_breathing
  text: Is the fish spending unusual time swimming right at the surface?
  evidence_id: surface_breathing
  priority_weight: 1.1
  effort_cost: 1.0
  reliability: 0.8
- id: ask_lethargy
  text: Is the fish noticeably less active than usual?
  evidence_id: lethargy
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.7
- id: ask_appetite_loss
  text: Has the fish stopped eating or eating much less?
  evidence_id: appetite_loss
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.85
- id: ask_hiding
  text: Is the fish hiding more than usual?
  evidence_id: hiding
  priority_weight: 0.9
  effort_cost: 1.0
  reliability: 0.7
- id: ask_white_spots
  text: Do you see small white, salt-grain-like spots on the body or fins?
  evidence_id: white_spots
  priority_weight: 1.3
  effort_cost: 1.0
  reliability: 0.9
- id: ask_frayed_fins
  text: Are the fins ragged, frayed, or eroding at the edges?
  evidence_id: frayed_fins
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.85
- id: ask_clamped_fins
  text: Are the fins held clamped/folded close to the body instead of spread out?
  evidence_id: clamped_fins
  priority_weight: 0.9
  effort_cost: 1.0
  reliability: 0.7
- id: ask_red_streaks_or_gills
  text: Do you see red streaks on the body or unusually red/inflamed gills?
  evidence_id: red_streaks_or_gills
  priority_weight: 1.1
  effort_cost: 1.0
  reliability: 0.8
- id: ask_excess_mucus
  text: Does the fish have a visibly excessive slime/mucus coating?
  evidence_id: excess_mucus
  priority_weight: 0.9
  effort_cost: 1.0
  reliability: 0.7
- id: ask_flashing_scratching
  text: Is the fish darting around and scratching itself against decor or substrate?
  evidence_id: flashing_scratching
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.8
- id: ask_num_fish_affected
  text: How many fish are showing symptoms?
  evidence_id: num_fish_affected
  priority_weight: 1.1
  effort_cost: 1.0
  reliability: 0.9
- id: ask_onset_timing
  text: How quickly did this start?
  evidence_id: onset_timing
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.75
- id: ask_ammonia_ppm
  text: What is your ammonia reading, in ppm?
  evidence_id: ammonia_ppm
  priority_weight: 1.3
  effort_cost: 2.0
  reliability: 0.95
  rationale: Requires a test kit, but is highly diagnostic and objective.
- id: ask_nitrite_ppm
  text: What is your nitrite reading, in ppm?
  evidence_id: nitrite_ppm
  priority_weight: 1.3
  effort_cost: 2.0
  reliability: 0.95
- id: ask_nitrate_ppm
  text: What is your nitrate reading, in ppm?
  evidence_id: nitrate_ppm
  priority_weight: 1.0
  effort_cost: 2.0
  reliability: 0.95
- id: ask_ph_level
  text: What is your pH reading?
  evidence_id: ph_level
  priority_weight: 1.0
  effort_cost: 1.5
  reliability: 0.95
- id: ask_temperature_f
  text: What is your water temperature, in °F?
  evidence_id: temperature_f
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.95
  rationale: A thermometer is near-universally already in the tank, so effort is low.
- id: ask_dissolved_oxygen_ppm
  text: What is your dissolved oxygen reading, in ppm, if you have a test kit?
  evidence_id: dissolved_oxygen_ppm
  priority_weight: 1.2
  effort_cost: 3.0
  reliability: 0.9
  rationale: A specialized, rarely-owned test kit -- high effort even though highly diagnostic.
- id: ask_tank_age_days
  text: How many days has this tank been set up?
  evidence_id: tank_age_days
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.95
- id: ask_recent_fish_added
  text: Have you added any new fish in the last 2 weeks?
  evidence_id: recent_fish_added
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.95
- id: ask_recent_water_change_large
  text: Have you done a large (more than 30%) water change in the last 2 days?
  evidence_id: recent_water_change_large
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.95
- id: ask_filter_disrupted
  text: Has the filter been cleaned, replaced, or turned off recently?
  evidence_id: filter_disrupted
  priority_weight: 1.1
  effort_cost: 1.0
  reliability: 0.9
- id: ask_ph_swings_reported
  text: Have you noticed pH changing a lot between tests?
  evidence_id: ph_swings_reported
  priority_weight: 1.0
  effort_cost: 1.5
  reliability: 0.8
  rationale: Requires the user to have tested more than once and remembered/recorded results.
