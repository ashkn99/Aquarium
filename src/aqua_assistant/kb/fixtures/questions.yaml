# One question per evidence item. priority_weight = expert-assigned
# clinical importance; effort_cost = how much work/equipment answering
# takes (covers "user effort" and "answerability" as one dimension for
# MVP simplicity); reliability = how much to trust a typical user's answer.

- id: ask_gasping
  text: Is the fish gasping at the surface?
  evidence_id: gasping
  priority_weight: 1.2
  effort_cost: 1.0
  reliability: 0.85
- id: ask_rapid_breathing
  text: Are the gills moving noticeably faster than normal?
  evidence_id: rapid_breathing
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.75
  rationale: Harder for a non-expert to judge "normal" gill rate accurately.
- id: ask_lethargy
  text: Is the fish noticeably less active than usual?
  evidence_id: lethargy
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.7
- id: ask_appetite_loss
  text: Has the fish stopped eating or eating much less?
  evidence_id: appetite_loss
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.85
- id: ask_hiding
  text: Is the fish hiding more than usual?
  evidence_id: hiding
  priority_weight: 0.9
  effort_cost: 1.0
  reliability: 0.7
- id: ask_white_spots
  text: Do you see small white, salt-grain-like spots on the body or fins?
  evidence_id: white_spots
  priority_weight: 1.3
  effort_cost: 1.0
  reliability: 0.9
- id: ask_frayed_fins
  text: Are the fins ragged, frayed, or eroding at the edges?
  evidence_id: frayed_fins
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.85
- id: ask_clamped_fins
  text: Are the fins held clamped/folded close to the body instead of spread out?
  evidence_id: clamped_fins
  priority_weight: 0.9
  effort_cost: 1.0
  reliability: 0.7
- id: ask_red_streaks_or_gills
  text: Do you see red streaks on the body or unusually red/inflamed gills?
  evidence_id: red_streaks_or_gills
  priority_weight: 1.1
  effort_cost: 1.0
  reliability: 0.8
- id: ask_excess_mucus
  text: Does the fish have a visibly excessive slime/mucus coating?
  evidence_id: excess_mucus
  priority_weight: 0.9
  effort_cost: 1.0
  reliability: 0.7
- id: ask_flashing_scratching
  text: Is the fish darting around and scratching itself against decor or substrate?
  evidence_id: flashing_scratching
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.8
- id: ask_num_fish_affected
  text: How many fish are showing symptoms?
  evidence_id: num_fish_affected
  priority_weight: 1.1
  effort_cost: 1.0
  reliability: 0.9
- id: ask_onset_timing
  text: How quickly did this start?
  evidence_id: onset_timing
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.75
- id: ask_ammonia_ppm
  text: What is your ammonia reading, in ppm?
  evidence_id: ammonia_ppm
  priority_weight: 1.3
  effort_cost: 2.0
  reliability: 0.95
  rationale: Requires a test kit, but is highly diagnostic and objective.
- id: ask_nitrite_ppm
  text: What is your nitrite reading, in ppm?
  evidence_id: nitrite_ppm
  priority_weight: 1.3
  effort_cost: 2.0
  reliability: 0.95
- id: ask_nitrate_ppm
  text: What is your nitrate reading, in ppm?
  evidence_id: nitrate_ppm
  priority_weight: 1.0
  effort_cost: 2.0
  reliability: 0.95
- id: ask_ph_level
  text: What is your pH reading?
  evidence_id: ph_level
  priority_weight: 1.0
  effort_cost: 1.5
  reliability: 0.95
- id: ask_temperature_f
  text: What is your water temperature, in °F?
  evidence_id: temperature_f
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.95
  rationale: A thermometer is near-universally already in the tank, so effort is low.
- id: ask_dissolved_oxygen_ppm
  text: What is your dissolved oxygen reading, in ppm, if you have a test kit?
  evidence_id: dissolved_oxygen_ppm
  priority_weight: 1.2
  effort_cost: 3.0
  reliability: 0.9
  rationale: A specialized, rarely-owned test kit -- high effort even though highly diagnostic.
- id: ask_tank_age_days
  text: How many days has this tank been set up?
  evidence_id: tank_age_days
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.95
- id: ask_recent_fish_added
  text: Have you added any new fish in the last 2 weeks?
  evidence_id: recent_fish_added
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.95
- id: ask_recent_water_change_large
  text: Have you done a large (more than 30%) water change in the last 2 days?
  evidence_id: recent_water_change_large
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.95
- id: ask_filter_disrupted
  text: Has the filter been cleaned, replaced, or turned off recently?
  evidence_id: filter_disrupted
  priority_weight: 1.1
  effort_cost: 1.0
  reliability: 0.9
- id: ask_ph_swings_reported
  text: Have you noticed pH changing a lot between tests?
  evidence_id: ph_swings_reported
  priority_weight: 1.0
  effort_cost: 1.5
  reliability: 0.8
  rationale: Requires the user to have tested more than once and remembered/recorded results.

# --- water quality (batch 1) ---
- id: ask_used_untreated_tap_water
  text: Did you add tap water without a dechlorinator/conditioner recently?
  evidence_id: used_untreated_tap_water
  priority_weight: 1.2
  effort_cost: 1.0
  reliability: 0.9
  rationale: Direct causal-history question, highly diagnostic for chlorine/chloramine poisoning.
- id: ask_water_change_frequency
  text: How often do you typically do water changes?
  evidence_id: water_change_frequency
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.85
- id: ask_copper_source_exposure
  text: Have you used a copper-based medication recently, or does your tank have copper plumbing/fixtures/decor?
  evidence_id: copper_source_exposure
  priority_weight: 1.0
  effort_cost: 1.5
  reliability: 0.8
  rationale: Requires the user to know their medication ingredients or plumbing, so reliability/effort are a bit lower than a simple observation.

# --- environmental/system (batch 2) ---
- id: ask_overstocking_reported
  text: Does your tank feel overstocked -- more fish than your filter or tank size comfortably supports?
  evidence_id: overstocking_reported
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.7
  rationale: Subjective self-assessment; reliability is lower than an objective reading since "appropriate stocking" varies by species and experience level.
- id: ask_planted_tank_with_co2_injection
  text: Is this a planted tank running injected CO2?
  evidence_id: planted_tank_with_co2_injection
  priority_weight: 1.1
  effort_cost: 1.0
  reliability: 0.95
- id: ask_visible_debris_or_detritus_buildup
  text: Do you see debris or detritus building up in one specific area of the tank?
  evidence_id: visible_debris_or_detritus_buildup
  priority_weight: 0.9
  effort_cost: 1.0
  reliability: 0.8

# --- infectious/parasitic disease (batch 3) ---
- id: ask_cottony_fuzzy_growth
  text: Do you see a cottony or fuzzy grey-white growth on the body or fins?
  evidence_id: cottony_fuzzy_growth
  priority_weight: 1.2
  effort_cost: 1.0
  reliability: 0.85
- id: ask_gold_rust_dust_coating
  text: Does the fish have a fine gold or rust-colored dusty coating on the skin?
  evidence_id: gold_rust_dust_coating
  priority_weight: 1.2
  effort_cost: 1.5
  reliability: 0.75
  rationale: A fine dusty coating is harder to spot than discrete spots or cottony growths, so reliability is lower and effort (often needs a flashlight at an angle) a bit higher.
- id: ask_white_fuzzy_patches_around_mouth
  text: Do you see white or grey fuzzy patches specifically around the mouth?
  evidence_id: white_fuzzy_patches_around_mouth
  priority_weight: 1.2
  effort_cost: 1.0
  reliability: 0.85
- id: ask_abnormal_buoyancy_or_swimming
  text: Is the fish floating, sinking, or swimming sideways/upside-down abnormally?
  evidence_id: abnormal_buoyancy_or_swimming
  priority_weight: 1.2
  effort_cost: 1.0
  reliability: 0.9
- id: ask_pinecone_scales
  text: Do the scales stand out from the body like a pinecone?
  evidence_id: pinecone_scales
  priority_weight: 1.1
  effort_cost: 1.0
  reliability: 0.85
# --- husbandry/behavior (batch 4) ---
- id: ask_torn_or_missing_fins_from_biting
  text: Are chunks of fin torn or missing, rather than ragged/eroding at the edges?
  evidence_id: torn_or_missing_fins_from_biting
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.75
  rationale: Distinguishing "bitten" from "frayed/eroding" damage takes a closer look than a simple yes/no on fin condition.
- id: ask_chasing_or_nipping_observed
  text: Have you seen another fish chasing or nipping at this one?
  evidence_id: chasing_or_nipping_observed
  priority_weight: 1.1
  effort_cost: 1.0
  reliability: 0.85
- id: ask_uneaten_food_accumulating
  text: Do you see uneaten food building up in the tank?
  evidence_id: uneaten_food_accumulating
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.85
- id: ask_improper_acclimation_reported
  text: Did you add this fish without a slow drip/float acclimation process?
  evidence_id: improper_acclimation_reported
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.8
- id: ask_insufficient_hiding_places
  text: Does the tank have little to no cover, decor, or hiding places?
  evidence_id: insufficient_hiding_places
  priority_weight: 0.9
  effort_cost: 1.0
  reliability: 0.85
- id: ask_color_fading_or_pale
  text: Has the fish's normal coloration noticeably faded or gone pale?
  evidence_id: color_fading_or_pale
  priority_weight: 0.9
  effort_cost: 1.0
  reliability: 0.7
  rationale: Requires the user to know what "normal" coloration looks like for this fish, so reliability is a bit lower.
- id: ask_sudden_multiple_fish_death
  text: Have multiple fish died suddenly, close together in time?
  evidence_id: sudden_multiple_fish_death
  priority_weight: 1.3
  effort_cost: 1.0
  reliability: 0.95
  rationale: High priority given its safety relevance, even though its direct diagnostic information gain is modest by design.

# --- plant health (batch 5) ---
- id: ask_leaf_yellowing_or_discoloration
  text: Are the leaves yellowing or losing their normal color?
  evidence_id: leaf_yellowing_or_discoloration
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.8
- id: ask_leaf_browning_or_holes
  text: Are the leaves browning at the edges or developing holes?
  evidence_id: leaf_browning_or_holes
  priority_weight: 0.9
  effort_cost: 1.0
  reliability: 0.75
- id: ask_stunted_or_slow_new_growth
  text: Is new growth stunted, unusually small, or very slow?
  evidence_id: stunted_or_slow_new_growth
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.7
  rationale: Slow growth is somewhat subjective without a prior baseline for that species, so reliability is a bit lower.
- id: ask_older_leaves_affected_first
  text: Are older/lower leaves affected before newer growth?
  evidence_id: older_leaves_affected_first
  priority_weight: 1.1
  effort_cost: 1.5
  reliability: 0.65
  rationale: Requires the user to compare leaf age, which takes closer observation than a simple yes/no symptom check.
- id: ask_new_growth_pale_or_distorted
  text: Is new growth specifically pale, small, or distorted?
  evidence_id: new_growth_pale_or_distorted
  priority_weight: 1.1
  effort_cost: 1.5
  reliability: 0.65
  rationale: Same reasoning as older_leaves_affected_first -- distinguishing new growth from older growth takes closer observation.
- id: ask_leggy_stretching_growth
  text: Are stems growing long and leggy, stretching toward the light source?
  evidence_id: leggy_stretching_growth
  priority_weight: 1.2
  effort_cost: 1.0
  reliability: 0.85
- id: ask_visible_algae_growth
  text: How much algae do you see in the tank?
  evidence_id: visible_algae_growth
  priority_weight: 1.2
  effort_cost: 1.0
  reliability: 0.85
- id: ask_old_leaves_melting_rapidly
  text: Are older leaves rapidly turning mushy or translucent and falling apart?
  evidence_id: old_leaves_melting_rapidly
  priority_weight: 1.2
  effort_cost: 1.0
  reliability: 0.85
- id: ask_leaves_shredded_or_bitten_pattern
  text: Do the leaves look shredded or bitten, rather than discolored or decaying?
  evidence_id: leaves_shredded_or_bitten_pattern
  priority_weight: 1.2
  effort_cost: 1.0
  reliability: 0.85
- id: ask_plant_floating_or_uprooted
  text: Is a plant floating loose or visibly uprooted?
  evidence_id: plant_floating_or_uprooted
  priority_weight: 1.1
  effort_cost: 1.0
  reliability: 0.9
- id: ask_roots_visibly_rotting_or_blackened
  text: Are the roots visibly rotting, mushy, or blackened?
  evidence_id: roots_visibly_rotting_or_blackened
  priority_weight: 1.1
  effort_cost: 1.5
  reliability: 0.7
  rationale: Checking roots usually means disturbing the substrate a bit, so it's a somewhat higher-effort, lower-reliability observation than a leaf check.
- id: ask_low_light_duration_or_intensity
  text: Is your lighting duration or intensity low for these plants' needs?
  evidence_id: low_light_duration_or_intensity
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.7
  rationale: Subjective self-assessment against a species' actual light requirement, similar to overstocking_reported.
- id: ask_long_photoperiod_or_intense_lighting
  text: Is your light running a long photoperiod (10+ hours/day) or unusually intense/direct sun?
  evidence_id: long_photoperiod_or_intense_lighting
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.8
- id: ask_co2_fluctuation_reported
  text: Does your CO2 injection fluctuate or drop out unpredictably?
  evidence_id: co2_fluctuation_reported
  priority_weight: 1.1
  effort_cost: 1.5
  reliability: 0.75
  rationale: Only answerable by CO2-injecting users, and noticing a fluctuation takes closer monitoring than a simple yes/no setup fact.
- id: ask_fertilization_dosing_reported
  text: How regularly do you dose plant fertilizer (liquid or root tabs)?
  evidence_id: fertilization_dosing_reported
  priority_weight: 1.0
  effort_cost: 1.0
  reliability: 0.85
- id: ask_substrate_disturbed_or_shallow_for_roots
  text: Is the substrate shallow, compacted, or was it recently disturbed?
  evidence_id: substrate_disturbed_or_shallow_for_roots
  priority_weight: 0.9
  effort_cost: 1.0
  reliability: 0.75
- id: ask_herbivorous_livestock_present
  text: Does your tank include fish, snails, or shrimp known to graze on live plants?
  evidence_id: herbivorous_livestock_present
  priority_weight: 0.9
  effort_cost: 1.0
  reliability: 0.85
- id: ask_recently_planted_or_moved
  text: Were these plants newly added or moved/replanted in the last 2-3 weeks?
  evidence_id: recently_planted_or_moved
  priority_weight: 1.2
  effort_cost: 1.0
  reliability: 0.95
- id: ask_num_plants_affected
  text: How many plants are showing symptoms?
  evidence_id: num_plants_affected
  priority_weight: 1.1
  effort_cost: 1.0
  reliability: 0.85
